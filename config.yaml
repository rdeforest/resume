---
# All of this is optional and matches the defaults, but provided here to
# document what can be changed.

project:      resume
theme:        table-based

watch:        false
watchSleepMs: 500
errorSleepMs: 10000
throbber:     spinner

dataDir:      data

# By default these are derived from 'project'
projectDir:   data/projects
data:         data/projects/resume.coffee
destination:  public/resume.html

# And these are derived from 'theme'
themeDir:     data/themes/table-based
template:     data/themes/table-based/main.pug

# Where 'cake deploy' publishes. The bucket serves through CloudFront, whose
# origin is the bucket's *website* endpoint -- that is what makes a bare
# https://defore.st/resume/ resolve to index.html.
deploy:
  bucket:       defore.st
  prefix:       resume
  distribution: EEK3E034N69I5
  cacheControl: 'public, max-age=300'
